name: KQ-009 Private Runtime Template Review

on:
  push:
    branches:
      - kq009-template-review
  pull_request:
    branches:
      - main
    paths:
      - "aldernia_runtime/private_github_canonical.py"
      - "tests/test_private_github_canonical.py"
      - "templates/private-runtime/**"
      - "docs/kq-009-private-github-cutover-template.md"

permissions:
  contents: read

jobs:
  deterministic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: KQ-009 targeted acceptance tests
        run: python -m unittest tests.test_private_github_canonical -v
      - name: Full deterministic regression
        run: python -m unittest discover -s tests -v
