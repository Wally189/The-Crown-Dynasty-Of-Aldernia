name: Central Aldernia Clock

on:
  workflow_dispatch:
    inputs:
      patrol_acceptance:
        description: "Run controlled Option-B fixture acceptance before the normal bounded patrol claim"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aldernia-runtime-state
  cancel-in-progress: false

jobs:
  clock-health-and-chime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deterministic clock and scheduler tests
        run: python -m unittest discover -s tests -v

      - name: Restore Dynasty runtime state
        run: |
          git fetch origin clock-state
          mkdir -p state
          git show origin/clock-state:state/clock-state.json > state/clock-state.json
          if git cat-file -e origin/clock-state:state/bus-session.json 2>/dev/null; then
            git show origin/clock-state:state/bus-session.json > state/bus-session.json
          else
            printf '{"acceptance":[],"accountable_owner":null,"activated_at":null,"activation_id":null,"command_ref":null,"complete_at":null,"halt_at":null,"last_30_minute_checkpoint":null,"last_transition_reason":"DORMANT BY DEFAULT","mission_id":null,"operating_state":"DORMANT","schema_version":1,"session_mode":null,"timed_expires_at":null}\n' > state/bus-session.json
          fi
          if git cat-file -e origin/clock-state:state/scheduled-duty-queue.json 2>/dev/null; then
            git show origin/clock-state:state/scheduled-duty-queue.json > state/scheduled-duty-queue.json
          else
            printf '{"events":{},"last_checked_at":null,"schema_version":1}\n' > state/scheduled-duty-queue.json
          fi

      - name: Bounded chime and timetable proof
        env:
          ALDERNIA_CLOCK_STATE: state/clock-state.json
        run: python -m proof.first_chime

      - name: Evaluate Crown timetable into COS-BUS due events
        run: >-
          python -m aldernia_runtime.scheduler
          --timetable aldernia/schedule/timetable.json
          --state state/scheduled-duty-queue.json
          --session state/bus-session.json

      - name: Check Option-B provider bindings
        id: option_b
        env:
          WIF_PROVIDER: ${{ vars.ALDERNIA_PATROL_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.ALDERNIA_PATROL_GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.ALDERNIA_PATROL_GCP_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.ALDERNIA_PATROL_OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] && [ -n "$GCP_PROJECT_ID" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Option-B provider bindings are present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Option-B provider bindings are incomplete; scheduler state will persist but unattended patrol will remain pending."
          fi

      - name: Obtain short-lived Google patrol token
        id: google_auth
        if: steps.option_b.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.ALDERNIA_PATROL_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.ALDERNIA_PATROL_WIF_PROVIDER }}
          service_account: ${{ vars.ALDERNIA_PATROL_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Controlled Option-B acceptance fixtures
        id: fixture
        if: >-
          steps.option_b.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.patrol_acceptance == true
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          OPENAI_API_KEY: ${{ secrets.ALDERNIA_PATROL_OPENAI_API_KEY }}
          ALDERNIA_PATROL_MODEL: gpt-5.6-luna
        run: >-
          python -m aldernia_runtime.unattended_patrol
          --state state/scheduled-duty-queue.json
          --timetable aldernia/schedule/timetable.json
          --session state/bus-session.json
          --fixture-test

      - name: Run one bounded unattended Heartbeat patrol slice
        id: patrol
        if: >-
          steps.option_b.outputs.configured == 'true' &&
          steps.fixture.outcome != 'failure'
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          OPENAI_API_KEY: ${{ secrets.ALDERNIA_PATROL_OPENAI_API_KEY }}
          ALDERNIA_PATROL_MODEL: gpt-5.6-luna
        run: >-
          python -m aldernia_runtime.unattended_patrol
          --state state/scheduled-duty-queue.json
          --timetable aldernia/schedule/timetable.json
          --session state/bus-session.json

      - name: Persist Dynasty logical clock, scheduler and worker state
        run: |
          cp state/clock-state.json /tmp/clock-state.json
          cp state/scheduled-duty-queue.json /tmp/scheduled-duty-queue.json
          rm -f state/clock-state.json state/scheduled-duty-queue.json state/bus-session.json
          git config user.name "Central Aldernia Clock"
          git config user.email "actions@users.noreply.github.com"
          git switch clock-state
          mkdir -p state
          cp /tmp/clock-state.json state/clock-state.json
          cp /tmp/scheduled-duty-queue.json state/scheduled-duty-queue.json
          git add state/clock-state.json state/scheduled-duty-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Clock/scheduler state: run ${GITHUB_RUN_ID} [skip ci]"
            git push origin clock-state
          fi

      - name: Fail closed after persisting an Option-B runtime exception
        if: >-
          steps.fixture.outcome == 'failure' ||
          steps.patrol.outcome == 'failure'
        run: |
          echo "Option-B runtime failed after durable scheduler/claim state was persisted." >&2
          exit 1
