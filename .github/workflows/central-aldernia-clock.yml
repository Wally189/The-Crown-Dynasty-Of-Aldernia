name: Central Aldernia Clock

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aldernia-runtime-state
  cancel-in-progress: false

jobs:
  clock-health-and-chime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out production main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK for keyless workload identity
        if: ${{ vars.OPENAI_WIF_AUDIENCE != '' && vars.OPENAI_IDENTITY_PROVIDER_ID != '' && vars.OPENAI_SERVICE_ACCOUNT_ID != '' }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir openai==3.16.2

      - name: Deterministic clock and scheduler tests
        run: python -m unittest discover -s tests -v

      - name: Restore Dynasty runtime state
        run: |
          git fetch origin clock-state
          mkdir -p state
          git show origin/clock-state:state/clock-state.json > state/clock-state.json
          if git cat-file -e origin/clock-state:state/bus-session.json 2>/dev/null; then
            git show origin/clock-state:state/bus-session.json > state/bus-session.json
          else
            printf '{"acceptance":[],"accountable_owner":null,"activated_at":null,"activation_id":null,"command_ref":null,"complete_at":null,"halt_at":null,"last_30_minute_checkpoint":null,"last_transition_reason":"DORMANT BY DEFAULT","mission_id":null,"operating_state":"DORMANT","schema_version":1,"session_mode":null,"timed_expires_at":null}\n' > state/bus-session.json
          fi
          if git cat-file -e origin/clock-state:state/scheduled-duty-queue.json 2>/dev/null; then
            git show origin/clock-state:state/scheduled-duty-queue.json > state/scheduled-duty-queue.json
          else
            printf '{"events":{},"last_checked_at":null,"schema_version":1}\n' > state/scheduled-duty-queue.json
          fi
          if git cat-file -e origin/clock-state:state/patrol-budget.json 2>/dev/null; then
            git show origin/clock-state:state/patrol-budget.json > state/patrol-budget.json
          else
            printf '{"schema_version":1,"month":"","input_tokens":0,"output_tokens":0,"estimated_usd":0.0,"calls":0}\n' > state/patrol-budget.json
          fi
          if git cat-file -e origin/clock-state:state/runtime-health.json 2>/dev/null; then
            git show origin/clock-state:state/runtime-health.json > state/runtime-health.json
          else
            printf '{"schema_version":1,"status":"NOT_YET_CHECKED","detail":"No governed ordinary-duty runtime health check has run yet.","processed_event_ids":[],"pending_count":0,"normal_path_requires_king_prompt":false}\n' > state/runtime-health.json
          fi
          if git cat-file -e origin/clock-state:state/opportunity-resolver-state.json 2>/dev/null; then
            git show origin/clock-state:state/opportunity-resolver-state.json > state/opportunity-resolver-state.json
          else
            printf '{"schema_version":1,"adapter_version":1,"resolver_state":{"schema_version":1,"blockers":{},"candidates":{}},"last_source_fingerprint":null,"last_decision_fingerprint":null,"run_count":0,"last_observed_at":null}\n' > state/opportunity-resolver-state.json
          fi
          if git cat-file -e origin/clock-state:state/opportunity-resolver-trace.json 2>/dev/null; then
            git show origin/clock-state:state/opportunity-resolver-trace.json > state/opportunity-resolver-trace.json
          else
            printf '{}\n' > state/opportunity-resolver-trace.json
          fi

      - name: Bounded chime and timetable proof
        env:
          ALDERNIA_CLOCK_STATE: state/clock-state.json
        run: python -m proof.first_chime

      - name: Evaluate Crown timetable into COS-BUS due events
        run: >-
          python -m aldernia_runtime.scheduler
          --timetable aldernia/schedule/timetable.json
          --state state/scheduled-duty-queue.json
          --session state/bus-session.json

      - name: Authenticate governed ordinary-duty runtime through Google WIF
        id: runtime-google-auth
        if: ${{ vars.GCP_ALDERNIA_RUNTIME_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_ALDERNIA_RUNTIME_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_ALDERNIA_RUNTIME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ALDERNIA_RUNTIME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive
            https://www.googleapis.com/auth/spreadsheets

      - name: Execute bounded pending ordinary Dynasty duties
        id: governed-runtime
        continue-on-error: true
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.runtime-google-auth.outputs.access_token }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.ALDERNIA_RUNTIME_OPENAI_API_KEY }}
        run: >-
          python -m aldernia_runtime.unattended_worker
          --state state/scheduled-duty-queue.json
          --timetable aldernia/schedule/timetable.json
          --session state/bus-session.json
          --health state/runtime-health.json
          --budget state/patrol-budget.json
          --max-events 4
          --worker-id "github-central-aldernia-clock-runtime-${GITHUB_RUN_ID}"

      - name: Authenticate bounded patrol identity through Google WIF
        id: patrol-google-auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_PATROL_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PATROL_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive
            https://www.googleapis.com/auth/spreadsheets

      - name: Execute at most one pending Dynasty integrity patrol slice
        id: patrol-runtime
        continue-on-error: true
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.patrol-google-auth.outputs.access_token }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.ALDERNIA_PATROL_OPENAI_API_KEY }}
        run: >-
          python -m aldernia_runtime.unattended_patrol
          --state state/scheduled-duty-queue.json
          --timetable aldernia/schedule/timetable.json
          --session state/bus-session.json
          --budget state/patrol-budget.json
          --worker-id "github-central-aldernia-clock-patrol-${GITHUB_RUN_ID}"

      - name: Observe Opportunity Resolver in shadow mode
        run: >-
          python -m aldernia_runtime.opportunity_shadow
          --queue state/scheduled-duty-queue.json
          --health state/runtime-health.json
          --state state/opportunity-resolver-state.json
          --trace state/opportunity-resolver-trace.json
          --run-id "${GITHUB_RUN_ID}"

      - name: Persist Dynasty logical clock and scheduler state
        run: |
          cp state/clock-state.json /tmp/clock-state.json
          cp state/scheduled-duty-queue.json /tmp/scheduled-duty-queue.json
          cp state/patrol-budget.json /tmp/patrol-budget.json
          cp state/runtime-health.json /tmp/runtime-health.json
          cp state/opportunity-resolver-state.json /tmp/opportunity-resolver-state.json
          cp state/opportunity-resolver-trace.json /tmp/opportunity-resolver-trace.json
          rm -f state/clock-state.json state/scheduled-duty-queue.json state/patrol-budget.json state/runtime-health.json state/opportunity-resolver-state.json state/opportunity-resolver-trace.json state/bus-session.json
          git config user.name "Central Aldernia Clock"
          git config user.email "actions@users.noreply.github.com"
          git switch clock-state
          mkdir -p state
          cp /tmp/clock-state.json state/clock-state.json
          cp /tmp/scheduled-duty-queue.json state/scheduled-duty-queue.json
          cp /tmp/patrol-budget.json state/patrol-budget.json
          cp /tmp/runtime-health.json state/runtime-health.json
          cp /tmp/opportunity-resolver-state.json state/opportunity-resolver-state.json
          cp /tmp/opportunity-resolver-trace.json state/opportunity-resolver-trace.json
          git add state/clock-state.json state/scheduled-duty-queue.json state/patrol-budget.json state/runtime-health.json state/opportunity-resolver-state.json state/opportunity-resolver-trace.json
          if ! git diff --cached --quiet; then
            git commit -m "Clock/scheduler state: run ${GITHUB_RUN_ID} [skip ci]"
            git push origin clock-state
          fi

      - name: Fail closed on unexpected governed ordinary-duty runtime crash
        if: steps.governed-runtime.outcome == 'failure'
        run: |
          echo "Governed ordinary-duty runtime crashed after durable state persistence." >&2
          exit 1

      - name: Fail closed on unexpected patrol runtime crash
        if: steps.patrol-runtime.outcome == 'failure'
        run: |
          echo "Unattended patrol runtime crashed after durable state persistence." >&2
          exit 1
