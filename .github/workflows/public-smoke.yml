name: Aldernia Public Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aldernia-public-smoke
  cancel-in-progress: true

jobs:
  verify-served-public-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out accepted main
        uses: actions/checkout@v5

      - name: Wait for served build identity
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wally189.github.io/The-Crown-Dynasty-Of-Aldernia"
          EXPECTED="$(python -c 'import json; print(json.load(open("aldernia/build.json"))["id"])')"
          seen=""
          for attempt in $(seq 1 30); do
            served="$(curl -fsSL --connect-timeout 5 --max-time 15 "$BASE/aldernia/build.json" || true)"
            if [ -n "$served" ]; then
              seen="$(python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' <<<"$served" 2>/dev/null || true)"
            fi
            if [ "$seen" = "$EXPECTED" ]; then
              echo "Served build identity: $seen"
              exit 0
            fi
            sleep 4
          done
          echo "Expected served build $EXPECTED but last observed $seen" >&2
          exit 1

      - name: Wait for backstage control paths to be absent
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wally189.github.io/The-Crown-Dynasty-Of-Aldernia"
          last_root=""
          last_manifest=""
          for attempt in $(seq 1 30); do
            last_root="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "$BASE/operating_spine/" || true)"
            last_manifest="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "$BASE/operating_spine/projection/manifest.json" || true)"
            if [ "$last_root" = "404" ] && [ "$last_manifest" = "404" ]; then
              echo "Backstage Operating Spine paths are absent from served Pages."
              exit 0
            fi
            sleep 4
          done
          echo "Expected backstage Operating Spine paths to be absent; observed root=$last_root manifest=$last_manifest" >&2
          exit 1

      - name: Verify public routes and working-country layers
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wally189.github.io/The-Crown-Dynasty-Of-Aldernia"
          index="$(curl -fsSL "$BASE/")"
          experiment="$(curl -fsSL "$BASE/experiment/")"
          country="$(curl -fsSL "$BASE/country/")"
          atlas="$(curl -fsSL "$BASE/country/map.html")"
          government="$(curl -fsSL "$BASE/country/government.html")"
          today="$(curl -fsSL "$BASE/country/today.html")"
          economy="$(curl -fsSL "$BASE/country/economy.html")"
          data="$(curl -fsSL "$BASE/country/data.html")"
          culture="$(curl -fsSL "$BASE/country/culture.html")"
          history="$(curl -fsSL "$BASE/country/history.html")"
          assembly="$(curl -fsSL "$BASE/country/assembly.html")"
          community="$(curl -fsSL "$BASE/country/community.html")"
          calendar="$(curl -fsSL "$BASE/aldernia/calendar.json")"

          grep -Fq "See the experiment" <<<"$index"
          grep -Fq "Enter Aldernia" <<<"$index"
          grep -Fq "data-computing-time" <<<"$index"
          grep -Fq "data-human-time" <<<"$index"
          grep -Fq "The machine was asked to stop being merely helpful." <<<"$experiment"
          grep -Fq "A testable project needs ways to be wrong." <<<"$experiment"
          grep -Fq "Measurement plan" <<<"$experiment"
          grep -Fq "The desk today" <<<"$(curl -fsSL "$BASE/country/media.html")"
          grep -Fq 'rel="canonical"' <<<"$country"
          curl -fsSL "$BASE/sitemap.xml" | grep -Fq "/country/media.html"
          curl -fsSL "$BASE/404.html" | grep -Fq "This road appears not to have been built."
          not_found_code="$(curl -sS -o /tmp/aldernia-404.html -w '%{http_code}' "$BASE/definitely-not-a-real-aldernia-page-404-check" || true)"
          test "$not_found_code" = "404"
          grep -Fq "This road appears not to have been built." /tmp/aldernia-404.html
          grep -Fq "An island that intends to have a Tuesday." <<<"$country"
          grep -Fq "Today has a shape" <<<"$country"
          grep -Fq 'class="country-surface country-zone-national"' <<<"$country"
          grep -Fq "Aldernia is shaped by water." <<<"$atlas"
          grep -Fq 'class="aldernia-map"' <<<"$atlas"
          grep -Fq "not a surveyed map" <<<"$atlas"
          grep -Fq "Power should explain itself." <<<"$government"
          grep -Fq "A country needs an ordinary day." <<<"$today"
          grep -Fq "An economy needs more than a currency symbol." <<<"$economy"
          grep -Fq "A number should arrive with luggage." <<<"$data"
          grep -Fq "Four numbers can look identical and mean completely different things." <<<"$data"
          grep -Fq "The same country should not taste, sound or feel identical everywhere." <<<"$culture"
          grep -Fq "The state is young. The places are not." <<<"$history"
          grep -Fq "Disagreement is a feature, not a software defect." <<<"$assembly"
          grep -Fq "The useful space between household and state." <<<"$community"
          grep -Fq '"reality": "public-fictional"' <<<"$calendar"

          echo "Served two-facet threshold and working-country layers verified."
